<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Probeats – Accueil</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="icon/png" href="css/logos/logo.png">
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo">
            <a href="index.html">
                <img src="css/images_produits/probeats-logo.png" alt="Probeats Logo" class="brand-logo-img">
            </a>
        </div>
        <nav>
            <a href="index.html" class="active">Accueil</a>
            <a href="pages/produits.html">Produits</a>
            <a href="pages/commande.html">Commander</a>
            <a href="pages/apropos.html">À propos</a>
            <a href="pages/assistance.html">Assistance</a>
        </nav>
        <div class="header-right">
            <div class="search-bar-container">
                <input type="text" placeholder="Rechercher..." class="search-bar">
                <span class="search-icon">🔍</span>
            </div>
            <img src="css/logos/user.png" alt="Mon compte" class="icon">
            <img src="css/logos/shopping-cart.png" alt="Panier" class="icon">
        </div>
    </div>
</header>

<main class="container-accueil">
    <section class="hero-left-content">
        
        <div class="hero-main-product">
            <img src="css/images_produits/casque.png" alt="Casque Probeats EVO2" class="main-casque-img">
        </div>

        <div class="hero-text">
            <h1>Casque haute définition 7.1</h1>
            <ul class="specs">
                <li>Bluetooth 3.0</li>
                <li>Charge 4h</li>
                <li>Autonomie jusqu'à 9h</li>
                <li>Housse de protection souple</li>
            </ul>
        </div>
        
        <div class="action-banner">
            <a href="pages/produits.html" class="btn-discover">Découvrir nos autres produits</a>
            
            <div class="miniatures-produits">
                <div class="mini-item">
                    <img src="css/images_produits/enceinte_portable.png" alt="Enceinte Small">
                </div>
                <div class="mini-item">
                    <img src="css/images_produits/enceinte_salon.png" alt="Enceinte Saloon">
                </div>
            </div>
        </div>
    </section>

    <div class="hero-right-images-stack">
        <img src="css/images_produits/img-2.png" alt="Homme travaillant avec le casque" class="ambient-img">
        <img src="css/images_produits/img-3.png" alt="Femme écoutant de la musique" class="ambient-img">
    </div>
</main>

<footer>
    <p>© 2026 – Probeats. Tous droits réservés.</p>
    <div class="socials">
        <a href="#" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" title="Twitter / X"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
        <a href="#" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        <a href="#" title="Discord"><i class="fa-brands fa-discord"></i></a>
    </div>
</footer>

</body>
</html>
